# CoderXP Wildcard Live Preview Subdomain Nginx Configuration
# Domain: *.preview.coderxp.pro, preview.coderxp.pro
# PRE-CUTOVER STATE: Returns static 503 until live preview isolation passes.

server {
    listen 80;
    server_name *.preview.coderxp.pro preview.coderxp.pro;
    default_type text/plain;
    return 503 "[CoderXP Live Preview Contained] Live preview is disabled pending pre-cutover isolation verification.\n";
}
